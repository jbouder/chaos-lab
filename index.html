<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Hugging Face's CDN rejects model downloads carrying some hosted referrers. -->
    <meta name="referrer" content="same-origin" />
    <meta
      name="description"
      content="A playground for breaking a web app on purpose, with an on-device assistant that triages what went wrong."
    />
    <title>Chaos Lab</title>
    <script>
      // Resolve the theme before first paint so there is no flash.
      (() => {
        try {
          const stored = localStorage.getItem("chaos-lab:theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
