<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Chaos Lab">
  <title>Chaos Lab</title>
  <rect width="32" height="32" rx="8" fill="#131a22" />
  <!-- One signal: holding steady, then stepping off a cliff. The healthy
       segment is drawn last so the break reads as a clean corner. -->
  <path
    d="M16 11 V21 H27.5"
    fill="none"
    stroke="#ff6f5c"
    stroke-width="3.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M4.5 11 H16"
    fill="none"
    stroke="#3ad6c5"
    stroke-width="3.25"
    stroke-linecap="round"
  />
</svg>
